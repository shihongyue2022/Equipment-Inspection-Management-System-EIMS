{% extends "base.html" %}

{% block title %}アカウント登録 - 設備点検管理システム{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">
    <i class="bi bi-person-plus me-2 text-primary"></i>アカウント登録
  </h2>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">

    <!-- バリデーション・重複エラーメッセージ -->
    {% if error_message %}
    <div class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
    </div>
    {% endif %}

    <!-- アカウント登録フォーム -->
    <form method="POST" action="{{ url_for('accounts.new_post') }}">
      <!-- CSRF対策トークン -->
      {{ form.hidden_tag() if form else '' }}

      <div class="row g-3">

        <!-- 社員番号 -->
        <div class="col-md-6">
          <label for="employee_no" class="form-label">
            社員番号 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="employee_no"
                 name="employee_no"
                 value="{{ form_data.employee_no if form_data else '' }}"
                 placeholder="例: TEC-201"
                 required>
        </div>

        <!-- 姓 -->
        <div class="col-md-3">
          <label for="last_name" class="form-label">
            姓 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="last_name"
                 name="last_name"
                 value="{{ form_data.last_name if form_data else '' }}"
                 placeholder="例: 山田"
                 required>
        </div>

        <!-- 名 -->
        <div class="col-md-3">
          <label for="first_name" class="form-label">
            名 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="first_name"
                 name="first_name"
                 value="{{ form_data.first_name if form_data else '' }}"
                 placeholder="例: 太郎"
                 required>
        </div>

        <!-- メールアドレス -->
        <div class="col-md-6">
          <label for="email" class="form-label">
            メールアドレス <span class="text-danger">*</span>
          </label>
          <input type="email"
                 class="form-control"
                 id="email"
                 name="email"
                 value="{{ form_data.email if form_data else '' }}"
                 placeholder="例: yamada@example.com"
                 required>
        </div>

        <!-- パスワード -->
        <div class="col-md-6">
          <label for="password" class="form-label">
            パスワード <span class="text-danger">*</span>
          </label>
          <input type="password"
                 class="form-control"
                 id="password"
                 name="password"
                 placeholder="パスワードを入力"
                 required>
        </div>

        <!-- ロール -->
        <div class="col-md-6">
          <label class="form-label">
            ロール <span class="text-danger">*</span>
          </label>
          <div class="d-flex gap-3 mt-1">
            <div class="form-check">
              <input class="form-check-input"
                     type="radio"
                     name="role"
                     id="role_engineer"
                     value="engineer"
                     {% if not form_data or form_data.role == 'engineer' %}checked{% endif %}
                     required>
              <label class="form-check-label" for="role_engineer">
                <span class="badge bg-info">FE（フィールドエンジニア）</span>
              </label>
            </div>
            {% if session['user']['role'] == 'root' %}
            <div class="form-check">
              <input class="form-check-input"
                     type="radio"
                     name="role"
                     id="role_admin"
                     value="admin"
                     {% if form_data and form_data.role == 'admin' %}checked{% endif %}>
              <label class="form-check-label" for="role_admin">
                <span class="badge bg-warning text-dark">管理者</span>
              </label>
            </div>
            {% endif %}
          </div>
        </div>

        <!-- 携帯番号（任意） -->
        <div class="col-md-6">
          <label for="phone" class="form-label">携帯番号</label>
          <input type="tel"
                 class="form-control"
                 id="phone"
                 name="phone"
                 value="{{ form_data.phone if form_data and form_data.phone else '' }}"
                 placeholder="例: 090-1234-5678">
          <div class="form-text">任意入力です。</div>
        </div>

        <!-- 拠点（任意） -->
        <div class="col-md-6">
          <label for="base" class="form-label">拠点</label>
          <input type="text"
                 class="form-control"
                 id="base"
                 name="base"
                 value="{{ form_data.base if form_data and form_data.base else '' }}"
                 placeholder="例: 東雲中央サービス拠点">
          <div class="form-text">任意入力です。</div>
        </div>

      </div>

      <!-- ボタングループ -->
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>登録
        </button>
        <a href="{{ url_for('accounts.list_get') }}" class="btn btn-outline-secondary">
          <i class="bi bi-x-circle me-1"></i>キャンセル
        </a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
