{% extends "base.html" %}

{% block title %}パスワード変更 - 設備点検管理システム{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">
    <i class="bi bi-key me-2 text-primary"></i>パスワード変更
  </h2>
</div>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <!-- エラーメッセージ -->
        {% if error_message %}
        <div class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
        </div>
        {% endif %}

        <!-- 成功メッセージ -->
        {% if success_message %}
        <div class="alert alert-success" role="alert">
          <i class="bi bi-check-circle me-1"></i>{{ success_message }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('accounts.my_password_post') }}">
          {{ form.hidden_tag() if form else '' }}

          <!-- 現在のパスワード -->
          <div class="mb-3">
            <label for="current_password" class="form-label">
              現在のパスワード <span class="text-danger">*</span>
            </label>
            <input type="password"
                   class="form-control"
                   id="current_password"
                   name="current_password"
                   placeholder="現在のパスワードを入力"
                   required>
          </div>

          <!-- 新しいパスワード -->
          <div class="mb-3">
            <label for="new_password" class="form-label">
              新しいパスワード <span class="text-danger">*</span>
            </label>
            <input type="password"
                   class="form-control"
                   id="new_password"
                   name="new_password"
                   placeholder="新しいパスワードを入力"
                   required>
          </div>

          <!-- 新しいパスワード（確認） -->
          <div class="mb-4">
            <label for="confirm_password" class="form-label">
              新しいパスワード（確認） <span class="text-danger">*</span>
            </label>
            <input type="password"
                   class="form-control"
                   id="confirm_password"
                   name="confirm_password"
                   placeholder="もう一度入力"
                   required>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-key me-1"></i>パスワードを変更
            </button>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>戻る
            </a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
