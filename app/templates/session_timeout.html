<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セッションタイムアウト - 設備点検管理システム</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- カスタムCSS -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5">

        <!-- タイトル -->
        <div class="text-center mb-4">
          <i class="bi bi-tools display-4 text-primary"></i>
          <h2 class="mt-2 fw-bold">設備点検管理システム</h2>
          <p class="text-muted">AKK空調設備株式会社</p>
        </div>

        <!-- タイムアウト通知カード -->
        <div class="card shadow-sm">
          <div class="card-body p-4 text-center">
            <i class="bi bi-clock-history display-5 text-warning mb-3"></i>
            <h5 class="card-title mb-3">セッションがタイムアウトしました</h5>
            <p class="text-muted mb-1">一定時間操作がなかったため、自動的にログアウトしました。</p>
            <p class="text-muted mb-4">
              <span id="countdown">3</span> 秒後にログイン画面へ移動します。
            </p>
            <a href="{{ url_for('login_get') }}" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-1"></i>すぐにログイン画面へ
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 3秒カウントダウン後にログイン画面へリダイレクトする
    var seconds = 3;
    var countdownEl = document.getElementById("countdown");

    var timer = setInterval(function () {
      seconds -= 1;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "{{ url_for('login_get') }}";
      }
    }, 1000);
  </script>
</body>
</html>
