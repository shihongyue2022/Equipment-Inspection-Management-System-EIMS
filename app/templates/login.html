<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 設備点検管理システム</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- カスタムCSS -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ログイン画面：画面中央にカードを表示 -->
  <div class="container pt-0">
    <div class="row justify-content-center mt-0">
      <div class="col-md-5">

        <!-- タイトル -->
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="E_T.ECH ロゴ" style="width: 160px; mix-blend-mode: multiply;">
          <h2 class="mt-2 fw-bold">設備点検管理システム</h2>
          <p class="text-muted">AKK空調設備株式会社</p>
        </div>

        <!-- ログインカード -->
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h5 class="card-title mb-4">ログイン</h5>

            <!-- エラーメッセージ -->
            {% if error_message %}
            <div class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
            </div>
            {% endif %}

            <!-- 案内メッセージ -->
            {% if info_message %}
            <div class="alert alert-info small" role="alert">
              <i class="bi bi-info-circle me-1"></i>{{ info_message }}
            </div>
            {% endif %}

            <!-- ログインフォーム -->
            <form method="POST" action="{{ url_for('login_post') }}">
              <!-- CSRF対策トークン -->
              {{ form.hidden_tag() if form else '' }}

              <!-- 社員番号 -->
              <div class="mb-3">
                <label for="employee_no" class="form-label">社員番号</label>
                <input
                  type="text"
                  class="form-control"
                  id="employee_no"
                  name="employee_no"
                  placeholder="例: ENG-021"
                  required
                  autofocus
                >
              </div>

              <!-- パスワード -->
              <div class="mb-4">
                <label for="password" class="form-label">パスワード</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="パスワードを入力"
                  required
                >
              </div>

              <!-- ログインボタン -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
