{% extends "base.html" %}

{% block title %}設備編集 - 設備点検管理システム{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">
    <i class="bi bi-pencil-square me-2 text-primary"></i>設備編集
  </h2>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">

    <!-- バリデーションエラーメッセージ -->
    {% if error_message %}
    <div class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>{{ error_message }}
    </div>
    {% endif %}

    <!-- 設備編集フォーム -->
    <form method="POST" action="{{ url_for('equipment.edit_post', equipment_id=equipment.id) }}">
      <!-- CSRF対策トークン -->
      {{ form.hidden_tag() if form else '' }}

      <div class="row g-3">

        <!-- 設備名 -->
        <div class="col-md-6">
          <label for="name" class="form-label">
            設備名 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="name"
                 name="name"
                 value="{{ equipment.name }}"
                 required>
        </div>

        <!-- 設置場所 -->
        <div class="col-md-6">
          <label for="location" class="form-label">
            設置場所 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="location"
                 name="location"
                 value="{{ equipment.location }}"
                 required>
        </div>

        <!-- 設備種別 -->
        <div class="col-md-6">
          <label for="equipment_type" class="form-label">
            設備種別 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="equipment_type"
                 name="equipment_type"
                 value="{{ equipment.equipment_type }}"
                 required>
        </div>

        <!-- 製造メーカー -->
        <div class="col-md-6">
          <label for="manufacturer" class="form-label">
            製造メーカー <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="manufacturer"
                 name="manufacturer"
                 value="{{ equipment.manufacturer }}"
                 required>
        </div>

        <!-- 型番 -->
        <div class="col-md-6">
          <label for="model_number" class="form-label">
            型番 <span class="text-danger">*</span>
          </label>
          <input type="text"
                 class="form-control"
                 id="model_number"
                 name="model_number"
                 value="{{ equipment.model_number }}"
                 required>
        </div>

        <!-- 設置年月 -->
        <div class="col-md-6">
          <label for="installed_at" class="form-label">
            設置年月 <span class="text-danger">*</span>
          </label>
          <input type="date"
                 class="form-control"
                 id="installed_at"
                 name="installed_at"
                 value="{{ equipment.installed_at }}"
                 required>
        </div>

        <!-- 点検間隔（月） -->
        <div class="col-md-6">
          <label for="inspection_interval_months" class="form-label">
            点検間隔（月） <span class="text-danger">*</span>
          </label>
          <input type="number"
                 class="form-control"
                 id="inspection_interval_months"
                 name="inspection_interval_months"
                 value="{{ equipment.inspection_interval_months }}"
                 min="1"
                 max="12"
                 required>
          <div class="form-text">1〜12の整数を入力してください。</div>
        </div>

        <!-- 担当エンジニア -->
        <div class="col-md-6">
          <label for="assigned_user_id" class="form-label">担当エンジニア</label>
          <select class="form-select"
                  id="assigned_user_id"
                  name="assigned_user_id">
            <option value="">未割当</option>
            {% for user in engineer_list %}
            <option value="{{ user.id }}"
              {% if equipment.assigned_user_id == user.id %}selected{% endif %}>
              {{ user.full_name }}
            </option>
            {% endfor %}
          </select>
        </div>

      </div>

      <!-- ボタングループ -->
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>保存
        </button>
        <a href="{{ url_for('equipment.list_get') }}" class="btn btn-outline-secondary">
          <i class="bi bi-x-circle me-1"></i>キャンセル
        </a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
